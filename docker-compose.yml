services:
  ecmwf-downloader:
    build: .
    container_name: ecmwf-downloader
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4g
    ports:
      - "8088:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  backend:
    external: true
    name: stribog3
